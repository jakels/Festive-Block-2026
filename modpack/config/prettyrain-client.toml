# Pretty Rain - Festive Block 26 preset (heavier snow, blizzard winds, fog).
# This is only the starting point: players can change it in-game via Mods > Pretty Rain > Config.
# Changed from defaults: snow.density 40->70, snow.windStrength 1.0->1.5,
# snow.stormWindStrength 3.0->4.5, doFogParticles false->true, doSandParticles true->false.

#Maximum number of particles allowed
maxParticleAmount = 1500
particleDensity = 100
particleStormDensity = 200
particleRadius = 25
doRainParticles = true
doSplashParticles = true
doSmokeParticles = true
doRippleParticles = true
doStreakParticles = true
doSnowParticles = true
doSandParticles = false
doShrubParticles = true
doFogParticles = true
doGroundFogParticles = true
doRainSounds = true
doSnowSounds = true
doSandSounds = true
renderVanillaWeather = false
tickVanillaWeather = false
biomeTint = true
tintMix = 50
spawnAboveClouds = false
cloudHeight = 191
alwaysRaining = false
yLevelWindAdjustment = true
syncRegistry = true

[rain]
	#Rain particle density
	density = 100
	gravity = 1.0
	windStrength = 0.3
	stormWindStrength = 0.5
	opacity = 100
	splashDensity = 5
	size = 2.0

[snow]
	density = 70
	gravity = 0.08
	rotationAmount = 0.03
	stormRotationAmount = 0.05
	windStrength = 1.5
	stormWindStrength = 4.5
	size = 2.0

[ripple]
	resolution = 16
	useResourcepackResolution = true

[sand]
	density = 80
	gravity = 0.2
	windStrength = 0.3
	moteSize = 0.1
	size = 2.0
	spawnOnGround = true
	matchTags = "minecraft:camel_sand_step_sound_blocks"

[shrub]
	density = 2
	gravity = 0.2
	rotationAmount = 0.2
	bounciness = 0.2

[fog]
	density = 20
	gravity = 0.2
	size = 0.5

[groundFog]
	density = 20
	spawnHeight = 64
	size = 8.0
