! Festive Block 26 - every non-snowy vanilla overworld biome is swapped for a snowy one.
! Terrain shape is untouched; only the biome (snow, plants, mobs, colours) changes.
! Biomes O' Plenty biomes are handled by config/biomesoplenty/biome_toggles.json instead.
! Lines starting with ! are comments. Do NOT use # for comments: # means a biome tag here.
! Cave biomes (lush_caves, dripstone_caves, deep_dark) are left alone on purpose.
! Rules are global on purpose: a [minecraft:overworld] header would stop them applying
! to TerraBlender (Biomes O' Plenty) regions, which only use global rules.

! Flatlands
minecraft:plains > minecraft:snowy_plains
minecraft:sunflower_plains > minecraft:snowy_plains
minecraft:savanna > minecraft:snowy_plains
minecraft:savanna_plateau > minecraft:snowy_plains
minecraft:desert > minecraft:snowy_plains
minecraft:swamp > minecraft:snowy_plains
minecraft:mangrove_swamp > minecraft:snowy_plains
minecraft:mushroom_fields > minecraft:snowy_plains

! Badlands become ice spikes for something rarer
minecraft:badlands > minecraft:ice_spikes
minecraft:eroded_badlands > minecraft:ice_spikes
minecraft:wooded_badlands > minecraft:ice_spikes

